[project]
name = "fleetmind"
version = "0.1.0"
description = "FleetMind — Federated Intelligent Predictive Maintenance for Bearing Fault Diagnosis"
requires-python = ">=3.11"
# Everything needed to BOOT THE API. The rule for this list is mechanical and
# enforced by tests/test_dependencies.py: if `import fleetmind.api.main` pulls a
# package in, it belongs here, not in an extra. `torch` and `langgraph` are here
# for exactly that reason -- the replay router imports the worker, which imports
# the pipeline, which imports ml.predict (torch) and agents.graph (langgraph).
# They were previously undeclared or extra-only, so a clean `pip install -e .`
# produced an app that could not start. Heavy, but true.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anyio>=4.4",
    "sqlalchemy>=2.0.31",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scipy>=1.13.1",
    "matplotlib>=3.9.0",
    # Agent orchestration. Imported by agents/graph.py and reached from the API.
    "langgraph>=0.1.19",
    # The classifier. Reached from the API via replay -> pipeline -> ml.predict.
    "torch>=2.3.1",
    # Auth (fleetmind/auth). Not optional like the LLM extra: every endpoint
    # requires a token, so the API cannot start usefully without these.
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "email-validator>=2.1",
]

[project.optional-dependencies]
# Federated-learning simulation only. `torch` moved to core (the API needs it);
# `scikit-learn` was removed because nothing imports it -- it was a dead
# declaration, confirmed by the AST scan in tests/test_dependencies.py.
ml = [
    "flwr>=1.9.0",
]
ingest = [
    "kagglehub>=0.2.9",
]
# The LLM narrative layer (fleetmind/agents/llm.py). Optional because the whole
# rule-based decision pipeline runs without it -- `anthropic` is imported lazily
# inside get_client() so an install without this extra still boots the API, and
# the narrative endpoint returns a clear 503 rather than an ImportError.
llm = [
    "anthropic>=1.11",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.4.8",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleetmind*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends-in-defaults is the standard pattern

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
