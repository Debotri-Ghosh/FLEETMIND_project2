version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: fleetmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fleetmind}
    ports:
      - "5432:5432"
    volumes:
      - fleetmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetmind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional lightweight DB viewer in the browser at http://localhost:8080
  adminer:
    image: adminer
    container_name: fleetmind_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  fleetmind_pgdata:
