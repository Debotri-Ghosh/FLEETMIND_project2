version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: fleetmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fleetmind}
    ports:
      - "5432:5432"
    volumes:
      - fleetmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetmind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: fleetmind_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://fleetmind:change_me@postgres:5432/fleetmind}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migration + depot seeding. Exits 0 when done.
  migrate:
    build: ./backend
    container_name: fleetmind_migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://fleetmind:change_me@postgres:5432/fleetmind}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: fleetmind_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Optional lightweight DB viewer at http://localhost:8080
  adminer:
    image: adminer
    container_name: fleetmind_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  fleetmind_pgdata:
