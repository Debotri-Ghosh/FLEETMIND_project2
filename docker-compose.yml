services:
  postgres:
    image: postgres:16
    container_name: fleetmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fleetmind}
    ports:
      - "5432:5432"
    volumes:
      - fleetmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetmind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: fleetmind_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleetmind}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-fleetmind}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /livez, not /health: every other route now requires a bearer token
      # (including /health, which reports database state), and a container
      # healthcheck has no credentials. /livez proves only that the process
      # is answering and discloses nothing.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    container_name: fleetmind_migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleetmind}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-fleetmind}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: fleetmind_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  adminer:
    image: adminer
    container_name: fleetmind_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  fleetmind_pgdata:

